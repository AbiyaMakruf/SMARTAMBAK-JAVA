<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Questions - Java Live Quiz</title>
  <link rel="stylesheet" href="/css/host.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    .manage-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .manage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2e3252;
    }
    .q-card-item {
      background: var(--bg-card);
      border: 1px solid #2e3252;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .q-card-item:hover {
      border-color: #7c4dff;
    }
    .q-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .q-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-mcq { background: rgba(19, 104, 206, 0.2); color: #60a5fa; }
    .badge-tf { background: rgba(216, 158, 0, 0.2); color: #fbbf24; }
    .badge-fib { background: rgba(0, 230, 118, 0.2); color: #00e676; }
    .q-controls {
      display: flex;
      gap: 8px;
    }
    .btn-icon {
      background: #2a2e4d;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-icon:hover { background: #3b426f; }
    .btn-icon.delete:hover { background: #ff5252; }
    .opt-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .opt-item {
      padding: 8px 12px;
      border-radius: 8px;
      background: #141525;
      font-size: 13px;
      border: 1px solid #252840;
    }
    .opt-item.correct {
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.1);
      color: #00e676;
      font-weight: 700;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      background: #1c1e33;
      border: 1px solid #3d436e;
      border-radius: 18px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }
    .form-row {
      margin-bottom: 14px;
    }
    .form-row label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #121320;
      border: 1.5px solid #2e3250;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus {
      border-color: #7c4dff;
    }
    textarea.form-control {
      font-family: 'Consolas', monospace;
      min-height: 80px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <nav class="host-nav">
    <div class="logo-group">
      <div class="logo-badge">☕ QUESTION MANAGER</div>
      <span style="font-size: 14px; color: var(--text-muted);">Configure questions for live sessions</span>
    </div>
    <div class="nav-actions">
      <a href="/host" class="btn-host btn-secondary">↩ Back to Host View</a>
      <button id="btn-save-server" class="btn-host btn-accent">💾 Save Questions to Server</button>
    </div>
  </nav>

  <div class="manage-container">
    <!-- Quiz Set Switcher & Manager Bar -->
    <div class="quiz-set-bar" style="background: var(--bg-card); border: 1px solid #2e3252; border-radius: 14px; padding: 18px 22px; margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div style="font-weight: 700; color: #fff; font-size: 15px;">📚 Quiz Set:</div>
        <select id="select-active-set" class="form-control" style="width: auto; min-width: 220px; font-weight: 600; background: #121320;">
          <!-- Loaded dynamically -->
        </select>
        <span id="active-badge" class="q-badge badge-fib" style="font-size: 12px; display: none;">⭐ ACTIVE FOR HOST</span>
        <button type="button" id="btn-set-active" class="btn-host btn-accent" style="padding: 8px 16px; font-size: 13px;">⭐ Set as Active</button>
      </div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button type="button" id="btn-rename-set" class="btn-host btn-secondary" style="padding: 8px 14px; font-size: 13px;">✏️ Rename</button>
        <button type="button" id="btn-new-set" class="btn-host btn-secondary" style="padding: 8px 14px; font-size: 13px;">➕ New Set</button>
        <button type="button" id="btn-delete-set" class="btn-host btn-danger" style="padding: 8px 14px; font-size: 13px;">🗑️ Delete</button>
      </div>
    </div>

    <div class="manage-header">
      <div>
        <h1 style="font-size: 24px;"><span id="display-quiz-title">Java Fundamentals</span> (<span id="total-q-count">0</span> Questions)</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="display-quiz-desc">
          Core Java concepts: OOP, immutability, memory, collections.
        </p>
      </div>
      <button id="btn-add-q" class="btn-host btn-accent">➕ Add New Question</button>
    </div>

    <!-- Questions list container -->
    <div id="questions-list">
      <!-- Question cards inserted dynamically -->
    </div>
  </div>

  <!-- Modal for New / Rename Quiz Set -->
  <div id="set-modal" class="modal-overlay">
    <div class="modal-box" style="max-width: 480px;">
      <h2 id="set-modal-title" style="font-size: 20px; margin-bottom: 16px;">Create New Quiz Set</h2>
      <form id="set-form">
        <input type="hidden" id="set-form-mode" value="create">
        <div class="form-row">
          <label>Quiz Title</label>
          <input type="text" id="set-form-title" class="form-control" placeholder="e.g. Python Essentials or MLOps Quiz" required>
        </div>
        <div class="form-row">
          <label>Language / Code Syntax</label>
          <select id="set-form-lang" class="form-control">
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="sql">SQL</option>
            <option value="general">General / Plain Text</option>
          </select>
        </div>
        <div class="form-row">
          <label>Description (Optional)</label>
          <input type="text" id="set-form-desc" class="form-control" placeholder="Brief summary of quiz topic">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" id="btn-cancel-set" class="btn-host btn-secondary">Cancel</button>
          <button type="submit" class="btn-host btn-accent">Save Quiz Set</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for Add / Edit Question -->
  <div id="q-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title" style="font-size: 20px; margin-bottom: 16px;">Add New Question</h2>
      
      <form id="q-form">
        <input type="hidden" id="edit-index" value="-1">

        <div class="form-row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 14px;">
          <div>
            <label>Question Type</label>
            <select id="form-type" class="form-control">
              <option value="multiple_choice">Multiple Choice (4 options)</option>
              <option value="true_false">True / False</option>
              <option value="fill_in">Fill in the Blank</option>
            </select>
          </div>
          <div>
            <label>Time Limit (Seconds)</label>
            <input type="number" id="form-timelimit" class="form-control" value="25" min="10" max="120">
          </div>
        </div>

        <div class="form-row">
          <label>Question Prompt (English)</label>
          <input type="text" id="form-question" class="form-control" placeholder="e.g. Which keyword prevents method overriding?" required>
        </div>

        <div class="form-row">
          <label>Java Code Snippet (Optional)</label>
          <textarea id="form-code" class="form-control" placeholder="public class Demo { ... }"></textarea>
        </div>

        <!-- Options for MCQ -->
        <div id="section-mcq" class="form-row">
          <label>Options & Correct Answer</label>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="radio" name="correct-opt" value="0" checked>
              <input type="text" id="opt-0" class="form-control" placeholder="Option 1 (Red ▲)" required>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="radio" name="correct-opt" value="1">
              <input type="text" id="opt-1" class="form-control" placeholder="Option 2 (Blue ◆)" required>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="radio" name="correct-opt" value="2">
              <input type="text" id="opt-2" class="form-control" placeholder="Option 3 (Yellow ●)">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="radio" name="correct-opt" value="3">
              <input type="text" id="opt-3" class="form-control" placeholder="Option 4 (Green ■)">
            </div>
          </div>
        </div>

        <!-- Options for True / False -->
        <div id="section-tf" class="form-row" style="display: none;">
          <label>Correct Answer</label>
          <div style="display: flex; gap: 20px;">
            <label style="color: white; font-weight: 700; cursor: pointer;">
              <input type="radio" name="correct-tf" value="0" checked> True
            </label>
            <label style="color: white; font-weight: 700; cursor: pointer;">
              <input type="radio" name="correct-tf" value="1"> False
            </label>
          </div>
        </div>

        <!-- Options for Fill in the Blank -->
        <div id="section-fib" class="form-row" style="display: none;">
          <label>Acceptable Correct Answers (comma-separated, case-insensitive)</label>
          <input type="text" id="form-fib-answers" class="form-control" placeholder="e.g. void, Void">
        </div>

        <div class="form-row">
          <label>Concept Explanation (Shown on Reveal)</label>
          <textarea id="form-explanation" class="form-control" placeholder="Explain why this answer is correct..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" id="btn-modal-cancel" class="btn-host btn-secondary">Cancel</button>
          <button type="submit" class="btn-host btn-accent">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="/js/manage.js"></script>
</body>
</html>
